<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <title>Portale Distributori Neofuel</title>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; frame-src 'none'; object-src 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- PWA Configuration -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0A2342" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Neofuel" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

  <link rel="icon" type="image/svg+xml" href="/assets/images/Favicon.svg" />
  <link rel="stylesheet" href="css/index.css?v=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.6.0/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-populate@1.21.0/browser/xlsx-populate.min.js?v=1.21.0"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.0/split.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>

<body>
  <!-- Header rimosso per interfaccia full-width -->

  <div class="login-container" id="login-container">
    <form id="login-form">
      <div class="login-header">
        <img class="login-logo" src="/assets/images/logo-svg.svg" alt="Logo Neofuel" />
        <p class="login-tagline">Portale Distributori</p>
      </div>

      <h1 class="login-title">Accedi</h1>
      <label for="email">Email</label>
      <input required id="email" name="email" type="email" autocomplete="email"
        placeholder="es. operatore@neofuel.it" />

      <label for="password">Password</label>
      <div class="password-wrapper">
        <input required id="password" name="password" autocomplete="current-password" type="password" />
        <button type="button" id="toggle-password" title="Mostra password">
          <i class="fas fa-eye" id="password-icon"></i>
        </button>
      </div>

      <button type="submit">Accedi</button>
      <div id="login-error" class="error-msg"></div>
    </form>
  </div>

  <div class="app-container hidden" id="app-container">
    <main id="main-content" class="p-3"></main>
    <!-- Contenuto dinamico inserito da app.js -->
  </div>

  <!-- aggiungi sempre dropdown-content e dropdown styles nel CSS o inline JS classi -->

  <script type="module" src="js/app.js?v=124"></script>
  <script type="module" src="js/ui/ui-settings-panel.js"></script>
</body>

</html>
