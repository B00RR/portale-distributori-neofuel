<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <title>Portale Distributori Neofuel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="assets/images/Favicon.svg" />
  <link rel="stylesheet" href="css/style.css?v=8" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.6.0/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-populate/browser/xlsx-populate.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.0/split.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script src="js/utils/template_chiusura_base64.js"></script>
</head>

<body>
  <!-- Header rimosso per interfaccia full-width -->

  <div class="login-container" id="login-container">
    <form id="login-form">
      <div class="login-header">
        <img class="login-logo" src="assets/images/logo svg.svg" alt="Logo Neofuel" />
        <p class="login-tagline">Portale Distributori</p>
      </div>

      <h1 class="login-title">Accedi</h1>
      <label for="email">Email</label>
      <input required id="email" name="email" type="email" autocomplete="email"
        placeholder="es. operatore@neofuel.it" />

      <label for="password">Password</label>
      <div class="password-wrapper">
        <input required id="password" name="password" autocomplete="current-password" type="password" />
        <button type="button" id="toggle-password" title="Mostra password">
          <i class="fas fa-eye" id="password-icon"></i>
        </button>
      </div>

      <button type="submit">Accedi</button>
      <div id="login-error" class="error-msg"></div>
    </form>
  </div>

  <div class="app-container" id="app-container" style="display: none;">
    <main id="main-content" style="padding: 16px;"></main>
    <!-- Contenuto dinamico inserito da app.js -->
  </div>

  <!-- aggiungi sempre dropdown-content e dropdown styles nel CSS o inline JS classi -->

  <script type="module" src="js/app.js?v=99"></script>
  <script type="module" src="js/ui/ui-settings-panel.js"></script>
</body>

</html>
