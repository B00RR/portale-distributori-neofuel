  <!-- PWA Configuration -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0A2342" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.6.0/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-populate@1.21.0/browser/xlsx-populate.min.js?v=1.21.0"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.0/split.min.js"></script>

</head>

<body>
  <!-- Header rimosso per interfaccia full-width -->


  <!-- ERROR BOUNDARY & RECOVERY SYSTEM -->
  <div id="global-error-boundary"
    style="display: none; position: fixed; inset: 0; background: #fff; z-index: 99999; padding: 2rem; text-align: center; font-family: system-ui, -apple-system, sans-serif;">
    <div
      style="max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; height: 100%; justify-content: center; align-items: center;">
      <h2 style="color: #e11d48; margin-bottom: 1rem;">Si è verificato un problema</h2>
      <p style="color: #475569; margin-bottom: 2rem;">L'applicazione non è riuscita ad avviarsi correttamente. Questo
        potrebbe essere dovuto a un aggiornamento incompleto o dati corrotti.</p>

      <button id="btn-force-reset"
        style="background: #e11d48; color: white; border: none; padding: 1rem 2rem; border-radius: 0.5rem; font-weight: bold; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
        RIPRISTINA APP
      </button>

      <p style="margin-top: 2rem; font-size: 0.8rem; color: #94a3b8;">Codice Errore: <span
          id="error-code-display">Unknown</span></p>
    </div>
  </div>

  <script>
    // SAFETY NET SCRIPT
    // Catch-all for startup errors
    (function () {
      var boundary = document.getElementById('global-error-boundary');
      var btn = document.getElementById('btn-force-reset');
      var codeDisplay = document.getElementById('error-code-display');

      function showError(msg) {
        if (boundary) boundary.style.display = 'block';
        if (codeDisplay) codeDisplay.textContent = msg || 'Startup Failure';
        console.error('CRITICAL STARTUP ERROR:', msg);
      }

      window.onerror = function (msg, source, lineno, colno, error) {
        // Ignore simple resize errors or extensions
        if (msg && typeof msg === 'string' && msg.indexOf('ResizeObserver') !== -1) return;
        showError(msg);
      };

      window.addEventListener('unhandledrejection', function (event) {
        showError(event.reason ? event.reason.message : 'Unhandled Promise Rejection');
      });

      // Force Reset Handler
      if (btn) {
        btn.onclick = function () {
          btn.textContent = 'Pulizia in corso...';
          btn.disabled = true;

          // 1. Unregister Service Workers
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              for (let registration of registrations) {
                registration.unregister();
              }
            });
          }

          // 2. Clear Storage
          localStorage.clear();
          sessionStorage.clear();

          // 3. Clear Caches
          if ('caches' in window) {
            caches.keys().then(function (names) {
              for (let name of names) {
                caches.delete(name);
              }
            });
          }

          // 4. Reload after short delay
          setTimeout(function () {
            window.location.reload(true);
          }, 1000);
        };
      }
    })();
  </script>

  <div class="login-container" id="login-container">
    <form id="login-form" onsubmit="event.preventDefault();">
      <div class="login-header">
        <img class="login-logo" src="/assets/images/logo-svg.svg" alt="Logo Neofuel" />
        <p class="login-tagline">Portale Distributori</p>
      </div>

      <h1 class="login-title">Accedi</h1>
      <label for="email">Email</label>
      <input required id="email" name="email" type="email" autocomplete="email"
        placeholder="es. operatore@neofuel.it" />

      <label for="password">Password</label>
      <div class="password-wrapper">
        <input required id="password" name="password" autocomplete="current-password" type="password" />
        <button type="button" id="toggle-password" title="Mostra password">
          <i class="fas fa-eye" id="password-icon"></i>
        </button>
      </div>

      <button type="submit">Accedi</button>
      <div id="login-error" class="error-msg"></div>
    </form>
  </div>

  <div class="app-container hidden" id="app-container">
    <main id="main-content" class="p-3"></main>
    <!-- Contenuto dinamico inserito da app.js -->
  </div>

  <!-- aggiungi sempre dropdown-content e dropdown styles nel CSS o inline JS classi -->

  <script type="module" src="js/app.js"></script>
</body>

</html>
