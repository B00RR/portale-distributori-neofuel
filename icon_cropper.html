<!DOCTYPE html>
<html>

<head>
    <title>Icon Cropper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #cropped-icon {
            width: 100vw;
            height: 100vh;
            background-image: url('icona_PWA.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
    </style>
</head>

<body>
    <div id="cropped-icon"></div>
</body>

</html>
