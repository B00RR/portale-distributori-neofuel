<!DOCTYPE html>
<html>

<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
            /* Dark background to see the icon clearly */
        }

        /* Frutiger Aero / Gel Style Container */
        /* Cushion / Gel Style Container */
        #icon-container {
            width: 512px;
            height: 512px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            /* Squircle Shape */
            border-radius: 95px;

            /* Gradient: Vibrant Lime -> White -> Sky Blue */
            background: linear-gradient(135deg,
                    #d0ec5b 0%,
                    /* Lime TL */
                    #fafff0 35%,
                    /* Cream/White Middle */
                    #f0f8ff 60%,
                    /* White/Blue Middle */
                    #8dc6e8 100%
                    /* Sky Blue BR */
                );

            /* The CUSHION effect: */
            box-shadow:
                /* 1. Glass Rim Edge (Sharp) */
                inset 0 0 0 2px rgba(255, 255, 255, 0.6),

                /* 2. Strong Top-Left Inner Glow (The "Puff") */
                inset 8px 8px 20px rgba(255, 255, 255, 1),

                /* 3. Deep Bottom-Right Inner Shade (The "Depth") */
                inset -8px -8px 25px rgba(0, 48, 93, 0.15),

                /* 4. Ambient Occlusion / Drop Shadow */
                0 30px 60px rgba(0, 0, 0, 0.3),
                0 10px 20px rgba(0, 0, 0, 0.2);

            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* The "Horizon" Gloss Reflection (Top Half) */
        #icon-container::before {
            content: '';
            position: absolute;
            top: 2%;
            left: 2%;
            right: 2%;
            height: 48%;

            /* Glassy White Gradient */
            background: linear-gradient(to bottom,
                    rgba(255, 255, 255, 0.95) 0%,
                    rgba(255, 255, 255, 0.6) 20%,
                    rgba(255, 255, 255, 0.1) 100%);

            /* Curved bottom edge for the "Lens" look */
            border-radius: 85px 85px 100px 100px / 85px 85px 30px 30px;

            z-index: 2;
            pointer-events: none;
        }

        /* Bottom "Caustic" Glow */
        #icon-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 15%;
            right: 15%;
            height: 25%;
            background: radial-gradient(ellipse at bottom, rgba(255, 255, 255, 0.7) 0%, transparent 70%);
            z-index: 2;
            filter: blur(15px);
            pointer-events: none;
        }

        /* Raise Content above Gloss */
        #logo-wrapper,
        .brand-text {
            z-index: 10;
        }

        /* Gloss/Shine Overlay */


        #logo-wrapper {
            width: 200px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            z-index: 1;
            /* Ensure content is below gloss but above background */
        }

        #logo-wrapper svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            /* Embossed/Beveled Look for Logo */
            filter:
                drop-shadow(0 2px 0px rgba(255, 255, 255, 0.5))
                /* Bottom Highlight */
                drop-shadow(0 -1px 1px rgba(0, 0, 0, 0.2))
                /* Top Shade */
                drop-shadow(0 5px 10px rgba(0, 0, 0, 0.15));
            /* Shadow */
        }

        /* ... existing SVG path styles ... */

        /* FORCE ALL PATHS TO UNIFORM NAVY BLUE */
        path[fill="rgb(0, 48, 93)"] {
            fill: #00305D !important;
            fill-opacity: 1 !important;
            stroke: none !important;
        }

        .brand-text {
            font-family: 'Inter', sans-serif;
            font-size: 90px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -2px;
            margin-top: 10px;
            /* Embossed/Beveled Look for Text */
            text-shadow:
                0 2px 0px rgba(255, 255, 255, 0.6),
                /* Bottom Highlight */
                0 5px 10px rgba(0, 0, 0, 0.15);
            /* Drop Shadow */
            z-index: 10;
        }


        .text-neo {
            color: #00305D;
            /* Navy Blue */
        }

        .text-fuel {
            color: #B3D234;
            /* Lime Green */
        }
    </style>

    <!-- Pannello di controllo per download icone -->
    <div id="controls"
        style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; z-index: 100;">
        <button onclick="downloadIcon(192)"
            style="padding: 12px 24px; background: #8DC63F; color: #00305D; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;">
            ⬇️ Scarica 192×192
        </button>
        <button onclick="downloadIcon(512)"
            style="padding: 12px 24px; background: #00305D; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;">
            ⬇️ Scarica 512×512
        </button>
    </div>

    <!-- html2canvas per cattura -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        async function downloadIcon(size) {
            const container = document.getElementById('icon-container');

            // Cattura l'elemento come canvas
            const canvas = await html2canvas(container, {
                width: 512,
                height: 512,
                scale: 2, // Alta qualità
                backgroundColor: null,
                logging: false,
                useCORS: true
            });

            // Ridimensiona se necessario
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = size;
            finalCanvas.height = size;
            const ctx = finalCanvas.getContext('2d');
            ctx.drawImage(canvas, 0, 0, size, size);

            // Download
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = finalCanvas.toDataURL('image/png');
            link.click();

            console.log(`✅ Icona ${size}x${size} scaricata!`);
        }
    </script>
