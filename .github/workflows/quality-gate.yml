name: 🧪 Elite Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint js --max-warnings 0

      - name: Run Prettier Check
        run: >-
          npx --yes prettier --check
          "js/**/*.{js,ts}"
          "config/playwright.global-*.js"
          "e2e/auth.spec.js"
          "e2e/helpers/mock-supabase.js"
          "scripts/e2e-live-seed.mjs"
          "scripts/auth-identity-migration/*.ts"
          "supabase/functions/_shared/*.ts"
          "supabase/functions/admin_create_user_v2/*.ts"
          "tests/unit/admin-create-user-v2*.test.ts"
          "tests/unit/auth*.test.ts"
          "tests/unit/schemas.test.ts"
          "tests/unit/database-types-336.test.ts"
          "docs/runbooks/305-auth-alias-migration.md"

  type-check:
    name: 🧩 TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run type-check
        run: npm run type-check

      - name: Type-check issue 304 Edge seams
        run: >-
          npx tsc --noEmit
          --target ESNext
          --module ESNext
          --moduleResolution bundler
          --lib ESNext,DOM
          --types vitest/globals
          --strict
          --skipLibCheck
          --allowImportingTsExtensions
          tests/unit/admin-create-user-v2.test.ts
          tests/unit/admin-create-user-v2-dependencies.test.ts
          supabase/functions/admin_create_user_v2/handler.ts
          supabase/functions/admin_create_user_v2/dependencies.ts

  deno-check:
    name: 🦕 Edge Function Deno Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Check all tracked Edge Functions
        run: |
          deno check --no-lock --node-modules-dir=auto supabase/functions/admin_create_user_v2/index.ts
          deno check --no-lock --node-modules-dir=auto supabase/functions/admin_reset_password_v2/index.ts
          deno check --no-lock --node-modules-dir=auto supabase/functions/update-prices/index.ts

      - name: Check issue 305 migration tooling
        run: >-
          deno check --no-lock --node-modules-dir=auto
          scripts/auth-identity-migration/cli.ts
          scripts/auth-identity-migration/disposable-smoke.ts

      - name: Test issue 305 artifact path guards
        run: >-
          deno test --no-lock --node-modules-dir=auto
          --allow-read --allow-write
          scripts/auth-identity-migration/cli_test.ts

  unit-tests:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:coverage

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Archive Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  e2e-tests:
    name: 🎭 End-to-End Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, mobile]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: |
          if [ "${{ matrix.browser }}" = "mobile" ]; then
            npx playwright install --with-deps webkit
          else
            npx playwright install --with-deps ${{ matrix.browser }}
          fi

      - name: Run Playwright Tests
        run: npx playwright test -c config/playwright.config.js --project=${{ matrix.browser }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}

      # #335: un test flaky (passato solo al retry) non deve produrre un
      # riepilogo verde silenzioso — fallisce il job se non è in allowlist.
      - name: Enforce flaky policy
        run: node scripts/check-e2e-flaky.mjs

      # #335: artefatti pubblicati per ogni run (non solo failure) così i
      # tentativi flaky restano ispezionabili.
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  security-scan:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Dependency Check
        run: npx snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  db-types-check:
    name: 🗄️ Database Types Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run db:types:check
        run: |
          mkdir -p /tmp
          npm run db:types:check > /tmp/database-types-diff.report 2>&1 || true
          cat /tmp/database-types-diff.report

      - name: Upload Types Diff Report
        uses: actions/upload-artifact@v4
        with:
          name: database-types-diff-report
          path: /tmp/database-types-diff.report

  migration-chain-check:
    name: 📜 Migration Chain Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Migrations Chain
        run: npm run db:migrations:verify > migration-report.txt 2>&1 || true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Archive Migration Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-report
          path: migration-report.txt

  build-check:
    runs-on: ubuntu-latest
    needs: [lint, type-check, deno-check, unit-tests, security-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
      - name: Build Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Archive Production Build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # #339 — Check AGGREGATO dei gate critici.
  #
  # Questo job è l'unico "required check" da abilitare nella branch protection
  # di `main` (vedi docs/runbooks/339-branch-protection.md). Attende tutti i
  # gate di blocco (lint, type-check, deno-check, unit-tests, e2e-tests matrix,
  # security-scan, build-check) e fallisce se UNO qualunque di essi fallisce.
  # Non marcare mai i singoli job come required: sono il dettaglio; `report`
  # è il gate aggregato su cui appoggiare il merge.
  #
  # NB: db-types-check e migration-chain-check sono volutamente NON bloccanti
  # (fase 1 di #336/#331): vengono riportati solo come informativi. Se in
  # futuro diventano obbligatori, aggiungerli alla condizione di exit qui sotto.
  report:
    name: 📊 Test Summary
    runs-on: ubuntu-latest
    needs:
      - lint
      - type-check
      - deno-check
      - unit-tests
      - e2e-tests
      - security-scan
      - build-check
      - db-types-check
      - migration-chain-check
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "Quality gate summary:"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Type-check: ${{ needs.type-check.result }}"
          echo "Deno check: ${{ needs.deno-check.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "Build: ${{ needs.build-check.result }}"
          echo "Database Types (info): ${{ needs.db-types-check.result }}"
          echo "Migration Chain (info): ${{ needs.migration-chain-check.result }}"

          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.deno-check.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ] || \
             [ "${{ needs.build-check.result }}" != "success" ]; then
            echo "❌ One or more quality gate jobs failed or were skipped."
            exit 1
          fi

          echo "✅ All quality gates passed!"
