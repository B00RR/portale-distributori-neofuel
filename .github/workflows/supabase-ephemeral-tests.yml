name: 🗄️ Supabase Ephemeral DB Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

jobs:
  ephemeral-db-tests:
    name: 🧪 Ephemeral Database Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Start Ephemeral Supabase Environment
        run: npx supabase start

      - name: Export Supabase Ephemeral Credentials
        run: |
          TMP_ENV="$(mktemp)"
          trap 'rm -f "$TMP_ENV"' EXIT
          npx supabase status -o env > "$TMP_ENV"
          set -a
          source "$TMP_ENV"
          set +a
          : "${API_URL:?API_URL missing from supabase status}"
          : "${ANON_KEY:?ANON_KEY missing from supabase status}"
          : "${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY missing from supabase status}"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Run Ephemeral DB Integration Tests
        run: npm run test:integration
        env:
          DATABASE_URL: 'postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres'
          SUPABASE_JWT_SECRET: 'super-secret-jwt-token-with-at-least-32-characters-long'
