
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Shifts</title>
</head>
<body>
    <h1>Checking Shifts Table...</h1>
    <div id="output"></div>
    <script type="module">
        import { supabase } from './js/api.js';

        async function checkShifts() {
            try {
                const { data, error } = await supabase
                    .from('shifts')
                    .select(`
                        *,
                        fuel_stations (station_name),
                        users!operator_id (full_name)
                    `)
                    .limit(1);

                const outputDiv = document.getElementById('output');
                if (error) {
                    console.error('Error fetching shifts:', error);
                    outputDiv.textContent = 'Error: ' + JSON.stringify(error, null, 2);
                } else {
                    console.log('Shifts data:', data);
                    outputDiv.textContent = 'Data: ' + JSON.stringify(data, null, 2);
                }
            } catch (err) {
                console.error('Unexpected error:', err);
                document.getElementById('output').textContent = 'Unexpected error: ' + err.message;
            }
        }

        checkShifts();
    </script>
</body>
</html>
