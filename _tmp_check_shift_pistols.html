<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Shift Pistols</title>
</head>

<body>
    <h1>Checking Shift Pistols Table...</h1>
    <div id="output"></div>
    <script type="module">
        import { supabase } from './js/api.js';

        async function checkShiftPistols() {
            try {
                const { data, error } = await supabase
                    .from('shift_pistols')
                    .select('*')
                    .limit(1);

                const outputDiv = document.getElementById('output');
                if (error) {
                    console.error('Error fetching shift_pistols:', error);
                    outputDiv.textContent = 'Error: ' + JSON.stringify(error, null, 2);
                } else {
                    console.log('Shift Pistols data:', data);
                    outputDiv.textContent = 'Data: ' + JSON.stringify(data, null, 2);
                }
            } catch (err) {
                console.error('Unexpected error:', err);
                document.getElementById('output').textContent = 'Unexpected error: ' + err.message;
            }
        }

        checkShiftPistols();
    </script>
</body>

</html>
