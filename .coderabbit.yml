# CodeRabbit Configuration
reviews:
  # Aiming to get under the 150 file limit by excluding non-essential paths
  max_files: 300 
  auto_review:
    enabled: true
  path_filters:
    - "!public/**/*"
    - "!assets/**/*"
    - "!docs/**/*"
    - "!sql/**/*"
    - "!tests/**/*"
    - "!package-lock.json"
    - "!**/*.md"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.svg"
    - "!**/*.pdf"
